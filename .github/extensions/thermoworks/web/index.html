<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BBQ Cook Monitor</title>
    <link rel="stylesheet" href="/kit/theme.css" />
    <style>
      /* ── BBQ fire theme — built on top of the kit's Primer tokens ────────── */
      :root {
        --bbq-ember: #ff7a18;
        --bbq-flame: #ff3b30;
        --bbq-gold: #ffd23f;
        --bbq-char: #1a1207;
        --bbq-hot: #ff5a3c;
        --bbq-cold: #4cc9f0;
      }
      body { padding: 14px; }
      .bbq-app { display: flex; flex-direction: column; gap: 12px; }

      /* Screen-reader-only text (visually hidden, still announced). */
      .bbq-sr {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      /* Visible focus ring for custom (non-kit) interactive controls. */
      .bbq-target-btn:focus-visible, .bbq-chip:focus-visible, .bbq-devchip:focus-visible,
      .bbq-pw-toggle:focus-visible, .bbq-link:focus-visible, .bbq-chat-list:focus-visible {
        outline: 2px solid var(--ck-focus); outline-offset: -1px;
      }

      /* ── animated fire hero ───────────────────────────────────────────── */
      /* No filter:blur / will-change / mix-blend anywhere here: those promote a
         GPU compositing layer that some real-GPU webviews (e.g. WebView2) fail to
         paint, blanking the surface. The fire GLOW comes from soft radial-gradient
         edges instead, and motion is opacity/transform-only — which paints
         reliably everywhere. */
      .bbq-hero {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid #3a2410;
        background:
          radial-gradient(60% 80% at 22% 130%, rgba(255, 210, 63, 0.30), transparent 70%),
          radial-gradient(70% 90% at 52% 135%, rgba(255, 59, 48, 0.34), transparent 70%),
          radial-gradient(60% 80% at 82% 130%, rgba(255, 122, 24, 0.30), transparent 70%),
          linear-gradient(160deg, #2a1a0c 0%, #160d05 60%, #0d0803 100%);
      }
      .bbq-hero.is-alarm {
        border-color: var(--bbq-flame);
        animation: bbq-alarm 1.1s ease-in-out infinite;
      }
      @keyframes bbq-alarm {
        0%, 100% { border-color: rgba(255, 59, 48, 0.5); }
        50% { border-color: rgba(255, 59, 48, 1); }
      }
      .bbq-flames { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 12px; }
      /* Soft glowing blobs — the radial gradient's transparent outer stop gives a
         blur-like glow WITHOUT filter:blur (no compositing layer). */
      .bbq-flame {
        position: absolute;
        bottom: -50px;
        width: 150px;
        height: 150px;
        opacity: 0.5;
        transform-origin: 50% 100%;
      }
      .bbq-flame.f1 { left: 8%; background: radial-gradient(circle at 50% 60%, rgba(255, 210, 63, 0.7), rgba(255, 122, 24, 0.35) 45%, transparent 70%); animation: bbq-flicker 2.1s ease-in-out infinite; }
      .bbq-flame.f2 { left: 42%; width: 190px; background: radial-gradient(circle at 50% 60%, rgba(255, 241, 194, 0.8), rgba(255, 59, 48, 0.4) 45%, transparent 72%); animation: bbq-flicker 1.6s ease-in-out infinite reverse; }
      .bbq-flame.f3 { right: 10%; background: radial-gradient(circle at 50% 60%, rgba(255, 210, 63, 0.7), rgba(255, 122, 24, 0.35) 45%, transparent 70%); animation: bbq-flicker 2.5s ease-in-out infinite; }
      @keyframes bbq-flicker {
        0%, 100% { transform: scaleY(1) translateX(0); opacity: 0.42; }
        35% { transform: scaleY(1.16) translateX(4px); opacity: 0.62; }
        70% { transform: scaleY(0.9) translateX(-4px); opacity: 0.5; }
      }
      .bbq-ember {
        position: absolute;
        bottom: 6px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffe39a, var(--bbq-ember) 70%, transparent);
        opacity: 0;
        animation-name: bbq-rise;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in;
      }
      @keyframes bbq-rise {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        12% { opacity: 0.95; }
        100% { transform: translateY(-86px) translateX(8px) scale(0.4); opacity: 0; }
      }
      .bbq-hero-body { position: relative; padding: 16px 18px; }
      .bbq-hero-top { display: flex; align-items: center; gap: 12px; }
      .bbq-logo { font-size: 30px; text-shadow: 0 2px 8px rgba(255, 90, 30, 0.7); }
      .bbq-titles h1 { margin: 0; color: #fff6ec; font-size: 1.4rem; letter-spacing: 0.2px; }
      .bbq-sub { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: #f0c89a; font-size: 12px; margin-top: 2px; }
      .bbq-sub .ck-icon { color: var(--bbq-gold); }
      .bbq-sep { opacity: 0.45; }
      .bbq-done-pill { color: #b9f6ca; font-weight: 600; }

      /* ── status bar ───────────────────────────────────────────────────── */
      .bbq-statusbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

      /* ── controls ─────────────────────────────────────────────────────── */
      .bbq-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .bbq-field { display: inline-flex; align-items: center; gap: 5px; color: var(--ck-muted); }
      .bbq-select { width: auto; padding: 3px 8px; }
      .bbq-add { display: inline-flex; align-items: center; gap: 5px; }
      .bbq-add-name { width: 120px; }
      .bbq-add-tgt { width: 70px; }

      /* ── pit panel ────────────────────────────────────────────────────── */
      .bbq-pit {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        border-radius: 12px; padding: 14px 18px;
        border: 1px solid var(--ck-border);
        background: linear-gradient(135deg, rgba(255, 122, 24, 0.12), rgba(255, 122, 24, 0.02));
        position: relative; overflow: hidden;
      }
      .bbq-pit::before {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
        background: var(--bbq-ember);
      }
      .bbq-pit-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #ffb877; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .bbq-pit-label .ck-icon { color: var(--bbq-ember); }
      .bbq-pit-temp { display: flex; align-items: baseline; gap: 2px; margin-top: 2px; }
      .bbq-big { font-family: var(--ck-mono); font-size: 2.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
      .bbq-pit .bbq-big { color: #ffd9b0; }
      .bbq-deg { font-size: 1.1rem; color: var(--ck-muted); }
      .bbq-rate { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ck-muted); margin-top: 4px; }
      .bbq-tag { padding: 1px 7px; border-radius: 999px; font-weight: 600; font-size: 11px; margin-left: 4px; }
      .bbq-tag.hot { background: rgba(255, 59, 48, 0.18); color: #ff7a6b; }
      .bbq-tag.cold { background: rgba(76, 201, 240, 0.16); color: var(--bbq-cold); }
      .bbq-pit-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }

      .bbq-target-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ck-muted); }
      .bbq-target-btn {
        display: inline-flex; align-items: center; gap: 5px;
        font: inherit; font-family: var(--ck-mono); font-size: 1.1rem; font-weight: 600;
        background: transparent; border: 1px dashed var(--ck-border); border-radius: 6px;
        color: var(--ck-fg); padding: 2px 9px; cursor: pointer;
      }
      .bbq-target-btn:hover { border-color: var(--bbq-ember); color: #ffce9e; }
      .bbq-target-btn .ck-icon { color: var(--ck-muted); }
      .bbq-edit { display: inline-flex; align-items: center; gap: 4px; }
      .bbq-edit-input { width: 76px; font-family: var(--ck-mono); }

      /* ── probe cards ──────────────────────────────────────────────────── */
      .bbq-grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
      .bbq-card {
        position: relative; overflow: hidden;
        border: 1px solid var(--ck-border); border-radius: 10px;
        background: var(--ck-bg-muted); padding: 11px 12px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .bbq-card.tone-hot { border-color: rgba(255, 59, 48, 0.5); box-shadow: inset 0 0 0 1px rgba(255, 59, 48, 0.15); }
      .bbq-card.is-done {
        border-color: rgba(63, 185, 80, 0.6);
        background: linear-gradient(135deg, rgba(63, 185, 80, 0.12), var(--ck-bg-muted));
      }
      .bbq-card.is-done::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
        transform: translateX(-100%); animation: bbq-shimmer 2.6s ease-in-out infinite;
      }
      @keyframes bbq-shimmer { to { transform: translateX(100%); } }
      .bbq-card-head { display: flex; align-items: center; gap: 6px; }
      .bbq-swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 6px currentColor; }
      .bbq-card-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
      .bbq-ready { font-size: 10.5px; font-weight: 700; color: #b9f6ca; background: rgba(63, 185, 80, 0.18); padding: 1px 7px; border-radius: 999px; flex: none; }
      .bbq-eta { font-size: 11px; color: var(--bbq-gold); flex: none; }
      .bbq-eta.dim { color: var(--ck-muted); }
      .bbq-card-temp { display: flex; align-items: baseline; gap: 4px; }
      .bbq-card-temp .bbq-big { font-size: 1.9rem; }
      .bbq-card-rate { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--ck-muted); margin-left: auto; }
      .bbq-progress { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
      .bbq-progress-bar { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
      .bbq-card-foot { display: flex; align-items: center; gap: 6px; }

      /* ── graph ────────────────────────────────────────────────────────── */
      .bbq-graph-card { border: 1px solid var(--ck-border); border-radius: 12px; background: var(--ck-bg-muted); padding: 12px 14px; }
      .bbq-graph-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
      .bbq-legend { display: flex; flex-wrap: wrap; gap: 10px; }
      .bbq-leg, .bbq-tip-name { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ck-muted); }
      .bbq-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
      .bbq-graph-wrap { position: relative; width: 100%; }
      .bbq-graph { width: 100%; height: auto; display: block; touch-action: pan-y; }
      .bbq-grid { stroke: var(--ck-border-muted); stroke-width: 1; opacity: 0.55; }
      .bbq-axis { fill: var(--ck-muted); font-size: 12px; font-family: var(--ck-mono); }
      .bbq-target { stroke-width: 1.2; stroke-dasharray: 5 5; opacity: 0.5; }
      .bbq-line { stroke-linejoin: round; stroke-linecap: round; }
      .bbq-now { animation: bbq-pulse 1.6s ease-in-out infinite; }
      @keyframes bbq-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      .bbq-stall { fill: rgba(255, 122, 24, 0.08); }
      .bbq-cross { stroke: var(--ck-fg); stroke-width: 1; opacity: 0.35; stroke-dasharray: 3 3; }
      .bbq-tip {
        position: absolute; top: 6px; transform: translateX(-50%);
        background: rgba(13, 17, 23, 0.95); border: 1px solid var(--ck-border);
        border-radius: 8px; padding: 7px 9px; pointer-events: none; min-width: 120px;
        box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.8); z-index: 5;
      }
      .bbq-tip-time { font-size: 11px; font-weight: 600; color: var(--bbq-gold); margin-bottom: 4px; font-family: var(--ck-mono); }
      .bbq-tip-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      .bbq-tip-name { flex: 1 1 auto; color: var(--ck-fg); }
      .bbq-tip-val { font-family: var(--ck-mono); font-weight: 600; }
      .bbq-graph-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
      .bbq-stall-key { display: inline-block; width: 12px; height: 8px; border-radius: 2px; background: rgba(255, 122, 24, 0.25); vertical-align: middle; margin-right: 2px; }

      /* ── pit master chat ──────────────────────────────────────────────── */
      .bbq-chat-card {
        border: 1px solid var(--ck-border); border-radius: 12px;
        background:
          radial-gradient(120% 120% at 100% 0%, rgba(255, 122, 24, 0.06), transparent 55%),
          var(--ck-bg-muted);
        padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
      }
      .bbq-chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .bbq-coach-ava {
        font-size: 20px; line-height: 1; flex: none;
        text-shadow: 0 1px 4px rgba(255, 90, 30, 0.6);
      }
      .bbq-coach-ava.sm { font-size: 16px; align-self: flex-end; margin-bottom: 1px; }
      .bbq-chat-list {
        display: flex; flex-direction: column; gap: 8px;
        max-height: 340px; overflow-y: auto; padding: 2px;
        scroll-behavior: smooth;
      }
      .bbq-chat-hello { padding: 6px 2px; }
      .bbq-chat-hello p { margin: 0; }
      .bbq-msg { display: flex; align-items: flex-end; gap: 6px; max-width: 92%; }
      .bbq-msg.is-user { align-self: flex-end; flex-direction: row-reverse; }
      .bbq-msg.is-coach { align-self: flex-start; }
      .bbq-bubble {
        padding: 8px 11px; border-radius: 12px; font-size: 13px; line-height: 1.45;
        white-space: pre-wrap; word-break: break-word;
        border: 1px solid var(--ck-border);
      }
      .bbq-msg.is-user .bbq-bubble {
        background: linear-gradient(135deg, #c2410c, #9a3412);
        color: #fff; border-color: transparent; border-bottom-right-radius: 4px;
      }
      .bbq-msg.is-coach .bbq-bubble {
        background: var(--ck-bg-inset); color: var(--ck-fg); border-bottom-left-radius: 4px;
      }
      .bbq-thinking { color: var(--ck-muted); display: inline-flex; align-items: center; gap: 7px; }
      .bbq-typing { display: inline-flex; gap: 3px; }
      .bbq-typing i {
        width: 5px; height: 5px; border-radius: 50%; background: var(--bbq-ember); display: inline-block;
        animation: bbq-bounce 1s infinite ease-in-out;
      }
      .bbq-typing i:nth-child(2) { animation-delay: 0.15s; }
      .bbq-typing i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bbq-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-4px); opacity: 1; } }
      .bbq-suggest { display: flex; flex-wrap: wrap; gap: 6px; }
      .bbq-chip {
        font: inherit; font-size: 12px; cursor: pointer;
        padding: 4px 10px; border-radius: 999px;
        border: 1px solid var(--ck-border); background: var(--ck-bg-inset); color: var(--ck-fg);
      }
      .bbq-chip:hover { border-color: var(--bbq-ember); color: #ffce9e; }
      .bbq-chat-input { display: flex; gap: 6px; align-items: center; }

      /* ── live sign-in ─────────────────────────────────────────────────── */
      .bbq-signin {
        border: 1px solid var(--ck-border); border-radius: 12px;
        background:
          radial-gradient(120% 120% at 100% 0%, rgba(255, 122, 24, 0.07), transparent 55%),
          var(--ck-bg-muted);
        padding: 16px; display: flex; flex-direction: column; gap: 12px;
      }
      .bbq-signin.bbq-checking { flex-direction: row; align-items: center; gap: 10px; color: var(--ck-muted); }
      .bbq-probe-note { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ck-muted); }
      .bbq-signin-head { display: flex; align-items: center; gap: 10px; }
      .bbq-field-lbl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ck-muted); }
      .bbq-pw { position: relative; display: flex; align-items: center; }
      .bbq-pw .ck-input { padding-right: 38px; }
      .bbq-pw-toggle {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        background: transparent; border: 0; color: var(--ck-muted); cursor: pointer;
        display: inline-flex; padding: 4px; border-radius: 4px;
      }
      .bbq-pw-toggle:hover { color: var(--ck-fg); }
      .bbq-signin-foot {
        display: flex; align-items: flex-start; gap: 7px;
        font-size: 11.5px; line-height: 1.45; color: var(--ck-muted);
        border-top: 1px solid var(--ck-border-muted); padding-top: 10px;
      }
      .bbq-signin-foot .ck-icon { color: var(--ck-success); margin-top: 1px; flex: none; }
      .bbq-signin-foot code, .bbq-signin-alt code { font-family: var(--ck-mono); font-size: 0.92em; color: var(--bbq-gold); }
      .bbq-signin-alt { font-size: 12px; color: var(--ck-muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .bbq-link {
        background: transparent; border: 0; padding: 0; cursor: pointer;
        color: var(--ck-link); font: inherit; display: inline-flex; align-items: center; gap: 4px;
      }
      .bbq-link:hover { text-decoration: underline; }
      .bbq-link.sm { font-size: 12px; }

      /* ── device / session picker ──────────────────────────────────────── */
      .bbq-devices { border: 1px solid var(--ck-border); border-radius: 10px; background: var(--ck-bg-muted); padding: 9px 11px; display: flex; flex-direction: column; gap: 8px; }
      .bbq-devices-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ck-muted); text-transform: uppercase; letter-spacing: 0.4px; }
      .bbq-devices-head .ck-icon { color: var(--bbq-ember); }
      .bbq-devices-head .ck-caption { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
      .bbq-devices-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .bbq-devchip {
        display: inline-flex; align-items: center; gap: 6px;
        font: inherit; font-size: 12px; cursor: pointer;
        padding: 4px 10px; border-radius: 999px;
        border: 1px solid var(--ck-border); background: var(--ck-bg-inset); color: var(--ck-fg);
      }
      .bbq-devchip:hover { border-color: var(--bbq-ember); }
      .bbq-devchip.is-sel { border-color: var(--bbq-ember); background: rgba(255, 122, 24, 0.14); color: #ffce9e; }
      .bbq-devdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
      .bbq-devdot.on { background: var(--ck-success); }
      .bbq-devdot.off { background: var(--ck-muted); }
      .bbq-devname { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bbq-devmeta { font-size: 10.5px; color: var(--ck-muted); }

      /* Honor reduced-motion for smooth scrolling (the kit guard covers
         animations/transitions but not scroll-behavior). */
      @media (prefers-reduced-motion: reduce) {
        .bbq-chat-list { scroll-behavior: auto; }
      }
    </style>
  </head>
  <body>
    <div id="app"><p class="ck-muted">Firing up the pit…</p></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
