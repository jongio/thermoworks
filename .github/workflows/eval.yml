name: Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Eval suite to run
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - integration
          - dev
      model:
        description: Model override (leave empty for eval.yaml default)
        required: false
        type: string
  schedule:
    - cron: "0 6 * * 1-5" # weekdays at 6am UTC

permissions: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run in the canonical repo so forks that copy this workflow can't
    # trigger it. Combined with the token guard below, external actors can never
    # make this job run with the Copilot secret in scope.
    if: github.repository == 'jongio/thermoworks'
    # Scope the Copilot token to a protected environment (set branch restrictions
    # / required reviewers in repo settings > Environments > copilot-eval).
    environment: copilot-eval
    permissions:
      contents: read
    env:
      # The Copilot runtime that Vally's copilot-sdk executor spawns authenticates
      # from COPILOT_GITHUB_TOKEN > GH_TOKEN > GITHUB_TOKEN (see `copilot help
      # environment`) — so COPILOT_GITHUB_TOKEN is what actually authenticates the
      # agent. Vally's optional LLM-grader client instead reads
      # GITHUB_COPILOT_API_TOKEN. Feed the same token to both so either path works.
      # This must be a PAT from an account with an active Copilot subscription; the
      # default Actions GITHUB_TOKEN has no Copilot model access.
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
      GITHUB_COPILOT_API_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Skip cleanly when no Copilot token is configured, so scheduled runs stay
      # green until the secret is provisioned (and never fail for external forks).
      - name: Run eval suite
        if: ${{ env.COPILOT_GITHUB_TOKEN != '' }}
        env:
          EVAL_SUITE: ${{ inputs.suite || 'smoke' }}
          EVAL_MODEL: ${{ inputs.model }}
        run: |
          ARGS="--suite $EVAL_SUITE --verbose"
          if [ -n "$EVAL_MODEL" ]; then
            ARGS="$ARGS --model $EVAL_MODEL"
          fi
          npx vally eval $ARGS

      - name: Upload eval results
        if: ${{ always() && env.COPILOT_GITHUB_TOKEN != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-results-${{ github.run_id }}
          path: vally-results/
          retention-days: 30
