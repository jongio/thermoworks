name: Release SDK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release-sdk
  cancel-in-progress: false

permissions: {}

jobs:
  release-sdk:
    name: Publish thermoworks-sdk
    runs-on: ubuntu-latest
    if: github.repository_owner == 'jongio'
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm -r typecheck
      - run: pnpm lint

      - name: Bump, publish, tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd packages/sdk
          VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          VERSION="${VERSION#v}"
          echo "Publishing thermoworks-sdk@$VERSION"
          pnpm publish --no-git-checks --provenance
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release thermoworks-sdk@$VERSION [skip ci]"
          git tag "sdk-v$VERSION"
          git push origin main --tags
          gh release create "sdk-v$VERSION" --title "thermoworks-sdk v$VERSION" --generate-notes
          echo "## Published thermoworks-sdk@$VERSION" >> "$GITHUB_STEP_SUMMARY"
