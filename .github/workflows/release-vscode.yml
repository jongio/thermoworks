name: Release VS Code Extension

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release-vscode
  cancel-in-progress: false

permissions: {}

jobs:
  release-vscode:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    if: github.repository_owner == 'jongio'
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm -r typecheck
      - run: pnpm lint

      - name: Bump, publish, tag
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd packages/vscode
          VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version)
          VERSION="${VERSION#v}"
          echo "Publishing jongio.thermoworks@$VERSION to VS Code Marketplace"
          pnpm exec vsce publish --no-dependencies --pat "$VSCE_PAT"
          if [ -n "$OVSX_PAT" ]; then
            echo "Publishing to Open VSX Registry"
            pnpm exec ovsx publish --pat "$OVSX_PAT" --no-dependencies
          fi
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release thermoworks-vscode@$VERSION [skip ci]"
          git tag "vscode-v$VERSION"
          git push origin main --tags
          gh release create "vscode-v$VERSION" --title "ThermoWorks for VS Code v$VERSION" --generate-notes
          echo "## Published jongio.thermoworks@$VERSION to Marketplace" >> "$GITHUB_STEP_SUMMARY"
