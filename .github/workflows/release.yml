name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'jongio'
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

      - name: Detect changes and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Determine bump type from commit messages since last release-related commit
          determine_bump() {
            local pkg_dir="$1"
            local last_tag="$2"

            # Get commits touching this package since last tag
            local commits
            commits=$(git log "$last_tag"..HEAD --format="%s" -- "$pkg_dir" 2>/dev/null || git log --format="%s" -- "$pkg_dir")

            if echo "$commits" | grep -qiE "^feat(\(|:|\!)"; then
              echo "minor"
            elif echo "$commits" | grep -qiE "^(fix|perf|refactor)(\(|:)"; then
              echo "patch"
            elif echo "$commits" | grep -qiE "BREAKING CHANGE|^feat!|^fix!"; then
              echo "major"
            else
              echo "none"
            fi
          }

          # Get latest tag for a package prefix
          latest_tag() {
            git tag --sort=-v:refname | grep "^$1" | head -1
          }

          # Bump version in package.json without git operations
          bump_version() {
            local dir="$1"
            local bump="$2"
            cd "$dir"
            local new_version
            new_version=$(npm version "$bump" --no-git-tag-version)
            echo "${new_version#v}"
            cd - > /dev/null
          }

          published=""

          # --- SDK ---
          SDK_TAG=$(latest_tag "sdk-v")
          SDK_BUMP=$(determine_bump "packages/sdk" "${SDK_TAG:-$(git rev-list --max-parents=0 HEAD)}")
          if [ "$SDK_BUMP" != "none" ]; then
            SDK_VERSION=$(bump_version "packages/sdk" "$SDK_BUMP")
            echo "Publishing thermoworks-sdk@$SDK_VERSION"
            cd packages/sdk && pnpm publish --no-git-checks --provenance && cd ../..
            published="$published sdk-v$SDK_VERSION"
          fi

          # --- CLI ---
          CLI_TAG=$(latest_tag "cli-v")
          CLI_BUMP=$(determine_bump "packages/cli" "${CLI_TAG:-$(git rev-list --max-parents=0 HEAD)}")
          if [ "$CLI_BUMP" != "none" ]; then
            CLI_VERSION=$(bump_version "packages/cli" "$CLI_BUMP")
            echo "Publishing thermoworks@$CLI_VERSION"
            cd packages/cli && pnpm publish --no-git-checks --provenance && cd ../..
            published="$published cli-v$CLI_VERSION"
          fi

          # --- VS Code ---
          VSCODE_TAG=$(latest_tag "vscode-v")
          VSCODE_BUMP=$(determine_bump "packages/vscode" "${VSCODE_TAG:-$(git rev-list --max-parents=0 HEAD)}")
          if [ "$VSCODE_BUMP" != "none" ]; then
            VSCODE_VERSION=$(bump_version "packages/vscode" "$VSCODE_BUMP")
            echo "Publishing thermoworks VS Code extension@$VSCODE_VERSION"
            cd packages/vscode && npx vsce publish --no-dependencies --pat "$VSCE_PAT" && cd ../..
            published="$published vscode-v$VSCODE_VERSION"
          fi

          # --- Commit version bumps and tag ---
          if [ -n "$published" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: release$published [skip ci]" || true

            for tag in $published; do
              git tag "$tag"
            done

            git push origin main --tags
            
            # Create GitHub releases
            for tag in $published; do
              gh release create "$tag" --generate-notes --latest=false
            done

            echo "## Released: $published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## No packages need releasing" >> "$GITHUB_STEP_SUMMARY"
          fi
