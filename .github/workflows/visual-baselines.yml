name: Visual Baselines

# Manually-triggered helper that regenerates Playwright visual-regression
# baselines on each CI runner platform and uploads them as artifacts. The
# baselines are committed from the downloaded artifacts so the web-visual job
# compares against snapshots rendered in the exact environments it runs in.
on:
  workflow_dispatch:

permissions: {}

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --dir packages/sdk build

      - run: pnpm --dir packages/web exec playwright install --with-deps chromium

      - name: Regenerate visual baselines for ${{ matrix.os }}
        run: pnpm --dir packages/web exec playwright test visual --update-snapshots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: visual-baselines-${{ matrix.os }}
          path: packages/web/e2e/visual.spec.ts-snapshots/
          retention-days: 3
          if-no-files-found: error
