name: Visual Baselines

# Manually-triggered helper that regenerates Playwright visual-regression
# baselines on each CI runner platform and uploads them as artifacts. The
# baselines are committed from the downloaded artifacts so the web-visual job
# compares against snapshots rendered in the exact environments it runs in.
on:
  workflow_dispatch:

permissions: {}

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --dir packages/sdk build

      - run: pnpm --dir packages/web exec playwright install --with-deps chromium

      - name: Regenerate visual baselines for ${{ matrix.os }}
        run: pnpm --dir packages/web exec playwright test visual --update-snapshots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visual-baselines-${{ matrix.os }}
          path: packages/web/e2e/visual.spec.ts-snapshots/
          retention-days: 3
          if-no-files-found: error
