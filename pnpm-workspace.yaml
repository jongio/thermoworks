packages:
  - "packages/*"
allowBuilds:
  '@biomejs/biome': true
  '@github/keytar': true
  '@vscode/vsce-sign': true
  better-sqlite3: true
  esbuild: true
  keytar: true
minimumReleaseAgeExclude:
